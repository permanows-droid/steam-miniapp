<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Пополнение Steam</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #8e98a3);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #3d4b5c);
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      font-size: 16px;
      outline: none;
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .preset-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--tg-theme-button-color, #2ea6ff);
      background: transparent;
      color: var(--tg-theme-text-color, #ffffff);
      font-weight: 600;
      cursor: pointer;
    }
    .preset-btn:active {
      background: var(--tg-theme-button-color, #2ea6ff);
    }
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 15px;
    }
    .hint-link {
      font-size: 12px;
      color: var(--tg-theme-link-color, #6ab2f2);
      margin-top: 6px;
      display: inline-block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <label for="steam-login">Логин Steam (не никнейм!)</label>
    <input type="text" id="steam-login" placeholder="Например: alex_gamer2026" autocomplete="off" />
    <span class="hint-link" onclick="showLoginHelp()">Где посмотреть логин?</span>
  </div>

  <div class="card">
    <label for="amount">Сумма зачисления на Steam ($)</label>
    <input type="number" id="amount" value="5" min="1" max="500" step="1" />
    
    <div class="presets">
      <button class="preset-btn" onclick="setAmount(5)">5 $</button>
      <button class="preset-btn" onclick="setAmount(10)">10 $</button>
      <button class="preset-btn" onclick="setAmount(25)">25 $</button>
    </div>

    <div class="summary">
      <span>Комиссия сервиса (10%):</span>
      <strong id="fee-display">0.50 $</strong>
    </div>
    <div class="summary" style="border: none; padding-top: 4px; font-size: 17px;">
      <span>К оплате:</span>
      <strong id="total-display" style="color: var(--tg-theme-button-color, #2ea6ff);">5.50 $</strong>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const COMMISSION_RATE = 0.10; // Твоя наценка 10%
    const loginInput = document.getElementById('steam-login');
    const amountInput = document.getElementById('amount');
    const feeDisplay = document.getElementById('fee-display');
    const totalDisplay = document.getElementById('total-display');

    // Настраиваем главную кнопку внизу экрана Telegram
    tg.MainButton.setText("ПЕРЕЙТИ К ОПЛАТЕ");
    tg.MainButton.show();

    function calculate() {
      const amount = parseFloat(amountInput.value) || 0;
      const fee = amount * COMMISSION_RATE;
      const total = amount + fee;
      
      feeDisplay.textContent = fee.toFixed(2) + ' $';
      totalDisplay.textContent = total.toFixed(2) + ' $';
      tg.MainButton.setText(`ОПЛАТИТЬ ${total.toFixed(2)} $`);
    }

    function setAmount(val) {
      amountInput.value = val;
      calculate();
    }

    function showLoginHelp() {
      tg.showAlert("Логин — это то имя, которое вы вводите при входе в аккаунт Steam. Посмотреть его можно в правом верхнем углу клиента Steam -> «Об аккаунте».");
    }

    amountInput.addEventListener('input', calculate);
    calculate();

    // Обработка нажатия на синюю кнопку Telegram внизу
    tg.MainButton.onClick(() => {
      const login = loginInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!login || login.length < 3) {
        tg.showAlert("Пожалуйста, введите корректный логин Steam!");
        return;
      }
      if (!amount || amount < 1) {
        tg.showAlert("Минимальная сумма пополнения — 1 $");
        return;
      }

      // Формируем данные для отправки в бота / на сервер
      const orderData = {
        action: "create_steam_order",
        steam_login: login,
        amount_usd: amount,
        total_usd: (amount * (1 + COMMISSION_RATE)).toFixed(2)
      };

      // Отправляем данные напрямую боту (самый простой способ для старта без сложного API)
      tg.sendData(JSON.stringify(orderData));
    });
  </script>
</body>
</html>
